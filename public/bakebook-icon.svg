<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- cream background — round corners match iOS/Android app icon style -->
  <rect width="200" height="200" rx="42" fill="#FBF4E4" stroke="#DDB84A" stroke-width="1.5"/>

  <g transform="translate(100,112) scale(1.52)">

    <!-- steam wisps -->
    <g stroke="#E8C870" stroke-width="1" fill="none" stroke-linecap="round">
      <path d="M-11,-28 Q-15,-35 -11,-41 Q-7,-47 -11,-52"/>
      <path d="M0,-28  Q-4,-35  0,-41  Q4,-47   0,-52"/>
      <path d="M11,-28 Q15,-35  11,-41 Q7,-47  11,-52"/>
    </g>

    <!-- bread loaf -->
    <path d="M-33,33 Q-37,33 -37,29 L-37,10 C-37,-38 37,-38 37,10 L37,29 Q37,33 33,33 Z"
          fill="#C98A1E"/>

    <!-- highlight shine -->
    <ellipse cx="-16" cy="-20" rx="5" ry="3" fill="white" opacity="0.25"/>

    <!-- score line across dome -->
    <path d="M-17,-1 Q0,-11 17,-1" fill="none" stroke="#8B6914" stroke-width="1" stroke-linecap="round"/>

  </g>

</svg>
